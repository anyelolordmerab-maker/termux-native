name: functional-test-241

# Prueba funcional ligera: NO recompila nada. Descarga el release publicado,
# monta el rootfs bionic y ejecuta un prompt real contra un modelo OpenAI-compatible
# local (mock). Valida que el binario hace una respuesta de agente de verdad.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release"
        type: string
        default: "opencode-v2.4.1"

permissions:
  contents: read

concurrency:
  group: functional-test-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  functional:
    name: Prompt real (bionic, desde release)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd file binutils curl python3 coreutils qemu-user-static
          mkdir -p work
          sudo mkdir -p /data
          sudo chmod 777 /data

      - name: Download release (.tar.zst + .sha256)
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          R="https://github.com/anyelolordmerab-maker/termux-native/releases/download/$TAG"
          curl -fsSL -o work/opencode-embedded-2.4.1.tar.zst "$R/opencode-embedded-2.4.1.tar.zst"
          curl -fsSL -o work/opencode-embedded-2.4.1.tar.zst.sha256 "$R/opencode-embedded-2.4.1.tar.zst.sha256"
          cd work && sha256sum -c opencode-embedded-2.4.1.tar.zst.sha256
          tar --zstd -xf opencode-embedded-2.4.1.tar.zst
          file opencode-embedded
          readelf -h opencode-embedded | grep -E 'Class|Machine|Type'

      - name: Bionic rootfs -> /system
        run: |
          set -euo pipefail
          cd work
          R=https://github.com/anyelolordmerab-maker/termux-native/releases/download
          curl -fsSL -o bionic.tgz "$R/toolchain/bionic-a14.tgz"
          mkdir -p bionic && tar -xzf bionic.tgz -C bionic
          LINKER=$(find bionic -name linker64 | head -1)
          LIBC=$(find bionic -name libc.so | head -1)
          LIBDIR=$(dirname "$LIBC")
          test -n "$LINKER" && test -n "$LIBC"
          sudo mkdir -p /system/bin /system/lib64 /linkerconfig
          sudo cp "$LINKER" /system/bin/linker64
          sudo cp -a "$LIBDIR"/. /system/lib64/ || true
          sudo find bionic -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -n {} /system/lib64/ \; 2>/dev/null || true
          sudo chmod 755 /system/bin/linker64
          file /system/bin/linker64

      - name: Mock modelo OpenAI-compatible (Python)
        run: |
          set -euo pipefail
          cat > /tmp/mock_model.py <<'PY'
          import json, time
          from http.server import BaseHTTPRequestHandler, HTTPServer

          MODEL = "mock-model"
          MAGIC = "OPENCODE_MOCK_OK"
          SUMMARY = """## Objective
- Maintain conversation continuity.

## Requirements
- (none)

## Decisions
- (none)

## Work State
### Completed
- (none)

### Active
- (none)

### Blocked
- (none)

## Next Move
1. Continue the task.

## Relevant Files
- (none)

## Important Context
- (none)"""

          def chunk(content, finish):
              return {
                  "id": "mock", "object": "chat.completion.chunk",
                  "created": int(time.time()), "model": MODEL,
                  "choices": [{"index": 0, "delta": ({"role": "assistant", "content": content} if content else {}), "finish_reason": finish}],
              }

          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get("content-length", "0") or 0)
                  body = json.loads(self.rfile.read(n) or b"{}")
                  if not self.path.endswith("/chat/completions"):
                      self.send_response(404); self.end_headers(); return
                  compact = "You MUST use this format for your response" in json.dumps(body)
                  content = SUMMARY if compact else MAGIC
                  if body.get("stream"):
                      self.send_response(200)
                      self.send_header("content-type", "text/event-stream")
                      self.end_headers()
                      for obj in (chunk(content, None), chunk("", "stop")):
                          self.wfile.write(("data: " + json.dumps(obj) + "\n\n").encode())
                      self.wfile.write(b"data: [DONE]\n\n")
                      self.wfile.flush()
                  else:
                      payload = {
                          "id": "mock", "object": "chat.completion", "created": int(time.time()), "model": MODEL,
                          "choices": [{"index": 0, "message": {"role": "assistant", "content": content}, "finish_reason": "stop"}],
                          "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2},
                      }
                      data = json.dumps(payload).encode()
                      self.send_response(200)
                      self.send_header("content-type", "application/json")
                      self.send_header("content-length", str(len(data)))
                      self.end_headers()
                      self.wfile.write(data)
              def log_message(self, *a):
                  pass

          HTTPServer(("127.0.0.1", 4599), H).serve_forever()
          PY
          python3 -m py_compile /tmp/mock_model.py
          python3 /tmp/mock_model.py > mock-model.log 2>&1 &
          echo $! > mock-model.pid
          for i in $(seq 1 30); do
            curl -fsS -X POST http://127.0.0.1:4599/v1/chat/completions \
              -H 'content-type: application/json' -d '{"model":"mock-model"}' >/dev/null && break
            sleep 0.5
          done
          curl -fsS -X POST http://127.0.0.1:4599/v1/chat/completions \
            -H 'content-type: application/json' -d '{"model":"mock-model"}' | grep -q OPENCODE_MOCK_OK

      - name: Run prompt real (bionic)
        run: |
          set -euo pipefail
          cd work
          export HOME="$PWD/home"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_STATE_HOME="$HOME/.local/state"
          export TMPDIR="$PWD/tmp"
          mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$TMPDIR"
          export OPENCODE_DISABLE_MODELS_FETCH=1
          export OPENCODE_DISABLE_AUTOUPDATE=1
          export OPENCODE_CONFIG_CONTENT='{"$schema":"https://opencode.ai/config.json","compaction":{"auto":true,"background":false,"keep":{"tokens":0},"buffer":"1%"},"model":"local/mock","providers":{"local":{"name":"Mock local","package":"@opencode/ai/providers/openai-compatible","settings":{"baseURL":"http://127.0.0.1:4599/v1","apiKey":"mock"},"models":{"mock":{"name":"Mock","modelID":"mock-model","capabilities":{"tools":false,"input":["text"],"output":["text"]},"limit":{"context":4096,"output":256}}}}}}'
          set +e
          timeout 120 qemu-aarch64-static -L / ./opencode-embedded run --model local/mock "Responde exactamente OPENCODE_MOCK_OK" > run-functional.log 2>&1
          RUN_RC=$?
          set -e
          echo "run_rc=$RUN_RC"
          cat run-functional.log
          grep -q 'OPENCODE_MOCK_OK' run-functional.log || { echo FUNCTIONAL_FAIL; exit 1; }
          echo FUNCTIONAL_OK

      - name: TUI standalone render (real pty)
        run: |
          set -euo pipefail
          cd work
          set +e
          timeout 55 script -q -e -c "qemu-aarch64-static -L / ./opencode-embedded" /dev/null > tui.log 2>&1
          echo "tui_exit=$?"
          set -e
          wc -c tui.log
          ( find "$TMPDIR" "$XDG_CACHE_HOME" "$HOME" /tmp -type f \( -name 'libopentui*.so' -o -name 'opencode-pty*' -o -name '*opentui*.so' \) 2>/dev/null | head -20 ) || true
          python3 - <<'PY'
          import sys
          d=open('tui.log','rb').read().decode('utf-8','replace')
          bad=['Unsupported OpenTUI','Failed to initialize','Pointer exceeds','dlopen failed','Cannot find module','exited with code 127','EACCES','ENOENT','not supported on the current platform']
          fail=False
          for b in bad:
              hit=b in d
              print(('BAD ' if hit else 'ok  ')+b)
              fail=fail or hit
          has_esc='\x1b[' in d
          print('has_escape', has_esc, 'bytes', len(d))
          print('--- SAMPLE ---')
          print(d[:1800])
          if fail or not has_esc or len(d)<800:
              print('TUI_TEST_FAIL'); sys.exit(1)
          print('TUI_TEST_OK')
          PY

      - name: Serve HTTP + TUI over server
        run: |
          set -euo pipefail
          cd work
          qemu-aarch64-static -L / ./opencode-embedded serve --hostname 127.0.0.1 --port 4517 > serve.log 2>&1 &
          SRV=$!
          ok=0
          for i in $(seq 1 60); do
            sleep 1
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4517/app || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
          done
          echo "serve_http_ok=$ok"
          PW=$(grep 'server password ' serve.log | tail -1 | sed 's/.*server password //')
          echo "pw_len=${#PW}"
          if [ "$ok" != "1" ]; then echo "SERVE_FAIL"; kill $SRV 2>/dev/null || true; exit 1; fi
          export OPENCODE_PASSWORD="$PW" OPENCODE_SERVER_PASSWORD="$PW"
          set +e
          timeout 40 script -q -e -c "qemu-aarch64-static -L / ./opencode-embedded --server http://127.0.0.1:4517" /dev/null > tui_srv.log 2>&1
          echo "tui_srv_exit=$?"
          set -e
          kill $SRV 2>/dev/null || true
          python3 - <<'PY'
          import sys
          d=open('tui_srv.log','rb').read().decode('utf-8','replace')
          bad=['Unsupported OpenTUI','Failed to initialize','Pointer exceeds','dlopen failed','Cannot find module','requires a password','EACCES','not supported on the current platform']
          fail=False
          for b in bad:
              hit=b in d
              print(('BAD ' if hit else 'ok  ')+b)
              fail=fail or hit
          has_esc='\x1b[' in d
          print('has_escape', has_esc, 'bytes', len(d))
          if fail or len(d)<800:
              print('TUI_SRV_FAIL'); sys.exit(1)
          print('TUI_SRV_OK')
          PY

      - name: Cleanup mock
        if: always()
        run: |
          [ -f mock-model.pid ] && kill "$(cat mock-model.pid)" 2>/dev/null || true
